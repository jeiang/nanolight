# Checks a published release end to end on each macOS it promises to run on
# (`zig build verify-release`: the files; `zig build verify-update`: a real
# first launch, a real update from the release before, and a lying feed
# refused, with `zig build verify-typing` between). release.yml calls this
# before a release reaches anyone; run it by hand on any release, and a change
# to these checks proves itself on its pull request against the newest release.
name: Verify release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      from:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to check (default: the newest)"
        required: false
      from:
        description: "The release that updates to it (default: the one before)"
        required: false
  pull_request:
    paths:
      - tools/verify_release.zig
      - tools/verify_update.zig
      - tools/verify_typing.zig
      - tools/feed_server.zig
      - tools/screen.zig
      - tools/macos.zig
      - tools/command.zig
      - tools/archive.zig
      - tools/png.zig
      - tools/release.zig
      - .github/workflows/verify-release.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # GitHub no longer runs macos-14 ("configuration not supported").
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # "from" is the published release just before "to" in the release list
      # (newest first), so that an older tag is never updated to from a newer
      # one; "to" may be a prerelease, as release.yml's is until it passes.
      # A pull request has nothing to verify until a release exists: it skips
      # what it can't check. A release's run fails instead.
      - name: Which releases
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ inputs.tag }}
          FROM: ${{ inputs.from }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q '.[] | select(.draft == false) | "\(.tag_name) \(.prerelease)"')
          to="${TO:-$(echo "$releases" | awk '$2 == "false" { print $1; exit }')}"
          if [ -z "$to" ] && [ "$PULL_REQUEST" = true ]; then
            echo "::notice::no published release yet: nothing to verify"
            exit 0
          fi
          if [ -z "$to" ]; then
            echo "::error::no published release to check"
            exit 1
          fi
          if ! echo "$releases" | awk -v to="$to" '$1 == to { found = 1 } END { exit !found }'; then
            echo "::error::$to is not a release of $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "to=$to" >> "$GITHUB_OUTPUT"
          from="${FROM:-$(echo "$releases" | awk -v to="$to" 'after && $2 == "false" { print $1; exit } $1 == to { after = 1 }')}"
          if [ -z "$from" ] && [ "$PULL_REQUEST" = true ]; then
            echo "::notice::no published release before $to: the update isn't checked"
            exit 0
          fi
          if [ -z "$from" ]; then
            echo "::error::no published release before $to to update from"
            exit 1
          fi
          echo "$from -> $to"
          echo "from=$from" >> "$GITHUB_OUTPUT"

      - name: The published files
        if: steps.which.outputs.to != ''
        run: zig build verify-release -- "${{ steps.which.outputs.to }}"

      - name: First launch, update, refusals
        if: steps.which.outputs.from != ''
        env:
          SHOTS: ${{ runner.temp }}/shots
          # A pull request changes the checks, not the published build they
          # run on: there the typing check reports, and a release must pass it.
          TYPING_EXPECT: ${{ github.event_name == 'pull_request' && 'any' || 'clean' }}
        run: zig build verify-update -- "${{ steps.which.outputs.from }}" "${{ steps.which.outputs.to }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.os }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

# Tests Nanolight and builds its app on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Zig: build.zig.zon's minimum_zig_version.
      - uses: mlugg/setup-zig@v2
      - run: zig build lint
      - run: zig build test
      # The Nix build's UI (no updater, no login item); nix's job runs it on Linux.
      - run: zig build test -Dnix=true
      - run: zig build app
      - run: zig build server
      - run: zig build -Dtarget=x86_64-windows-gnu --prefix zig-out/windows
      - run: zig build -Dtarget=x86_64-linux-gnu --prefix zig-out/linux
      - run: zig build app -Dnix=true --prefix zig-out/nix-app
      - run: zig build -Dnix=true -Dtarget=x86_64-windows-gnu --prefix zig-out/nix-windows

  # The tests on Linux, where they draw with nanoui's own text and renderer.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: zig build test
      - run: zig build server

  # Needs a committed flake.lock (`nix flake lock`).
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check -L

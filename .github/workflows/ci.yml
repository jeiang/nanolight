# Tests Nanolight and builds its app on every push and pull request.
# The Mac's job is the expensive one: a newer push to the same branch
# cancels the run it superseded.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Zig: build.zig.zon's minimum_zig_version.
      - uses: mlugg/setup-zig@v2
      - run: zig build lint
      - run: zig build test
      # The Nix build's UI (no updater, no login item); nix's job runs it on Linux.
      - run: zig build test -Dnix=true
      - run: zig build app
      - run: zig build server
      - run: zig build -Dtarget=x86_64-windows-gnu --prefix zig-out/windows
      - run: zig build -Dtarget=x86_64-linux-gnu --prefix zig-out/linux
      - run: zig build -Dtarget=aarch64-linux-gnu --prefix zig-out/linux-arm
      - run: zig build app -Dnix=true --prefix zig-out/nix-app
      - run: zig build -Dnix=true -Dtarget=x86_64-windows-gnu --prefix zig-out/nix-windows

  # The tests on Linux, where they draw with nanoui's own text and renderer.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: zig build test
      - run: zig build server

  # Needs a committed flake.lock (`nix flake lock`).
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake check -L

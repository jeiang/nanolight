# Builds Nanolight for macOS (Apple silicon), Windows and Linux (x86_64 and
# arm64, cross-compiled here) and attaches them, with the update feed the
# app's updater reads (manifest.json, each archive's sha256), to the GitHub
# release of the tag that was pushed.
#
# The release starts as a prerelease: the updater and the "latest" download
# links don't see one. verify-release.yml then checks the published files on
# each macOS, launches them, and updates the release before to this one; only
# if all that passes does it become the latest. A release that fails stays a
# prerelease, and nobody gets it: fix it and push a new tag, or rerun the
# failed jobs if Apple or GitHub was the trouble. If a pushed tag's run never
# starts (GitHub has dropped the event), `gh workflow run release.yml --ref vX`
# does the same.
#
# Signing and notarization use these repository secrets of jeiang/nanolight.
# All are optional. With all five, the app and image are signed with
# a Developer ID and notarized; without them, they are signed ad hoc
# (Gatekeeper asks once, and the app can't update itself): the Signing
# identity and Notary credentials steps are skipped when MACOS_CERT_P12 is
# empty, and macos/package.sh then signs with "codesign --sign -".
#   MACOS_CERT_P12       base64 of a "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD  its password
#   AC_API_KEY_P8        an App Store Connect API key (the .p8's contents)
#   AC_API_KEY_ID        its key id
#   AC_API_ISSUER_ID     its issuer id
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Signing identity
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(uuidgen)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Notary credentials
        if: env.MACOS_CERT_P12 != '' && env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" > "$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version="0.0.0-${GITHUB_SHA::7}" ;; esac
          VERSION="$version" sh macos/package.sh

      - name: Windows and Linux
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version="0.0.0-${GITHUB_SHA::7}" ;; esac
          VERSION="$version" sh pc/package.sh

      - name: Check
        run: |
          codesign --verify --strict --verbose=2 zig-out/package/Nanolight.app
          hdiutil verify zig-out/package/nanolight-macos-arm64.dmg
          if [ -n "${NOTARY_KEY_PATH:-}" ]; then
            # Validating asks Apple's CloudKit too, which drops the
            # connection now and then (error 68): a few tries, as stapling.
            validate() {
              for try in 1 2 3 4 5; do
                xcrun stapler validate "$1" && return 0
                echo "validating $1 failed (try $try); retrying" >&2
                sleep $((try * 10))
              done
              return 1
            }
            validate zig-out/package/Nanolight.app
            validate zig-out/package/nanolight-macos-arm64.dmg
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nanolight-macos-arm64
          path: |
            zig-out/package/nanolight-macos-arm64.dmg
            zig-out/package/nanolight-macos-arm64.dmg.sha256
            zig-out/package/nanolight-macos-arm64.zip
            zig-out/package/nanolight-windows-x86_64.zip
            zig-out/package/nanolight-linux-x86_64.tar.gz
            zig-out/package/nanolight-linux-aarch64.tar.gz
            zig-out/package/*.sha256
            zig-out/package/manifest.json

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          cd zig-out/package
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --title "Nanolight ${tag#v}" --notes "Nanolight ${tag#v} for macOS 14 and later (Apple silicon: open the disk image and drag Nanolight to Applications), Windows 10 and later (x86_64: unzip and run nanolight.exe) and Linux (x86_64, arm64; X11, GTK 3: unpack and run nanolight)."
          gh release upload "$tag" nanolight-macos-arm64.dmg nanolight-macos-arm64.dmg.sha256 nanolight-macos-arm64.zip \
            nanolight-windows-x86_64.zip nanolight-linux-x86_64.tar.gz nanolight-linux-aarch64.tar.gz \
            nanolight-windows-x86_64.zip.sha256 nanolight-linux-x86_64.tar.gz.sha256 nanolight-linux-aarch64.tar.gz.sha256 \
            manifest.json --clobber

  verify:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: The latest release, for everyone
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub answers 502 now and then, and may apply half of the edit: asks
        # again until "latest" really is this release, which everyone follows.
        run: |
          for try in 1 2 3 4 5; do
            if gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest &&
              [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)" = "$GITHUB_REF_NAME" ]; then
              exit 0
            fi
            echo "$GITHUB_REF_NAME isn't the latest yet (try $try); retrying" >&2
            sleep $((try * ${RETRY_S:-20}))
          done
          exit 1

# Builds Nanolight for macOS (Apple silicon), Windows and Linux (x86_64 and
# arm64, cross-compiled here) and attaches them, with the update feed the
# app's updater reads (manifest.json, each file's sha256) and each build's
# debug symbols, to the GitHub release of the tag that was pushed: all of
# it is `zig build package` (tools/package.zig).
#
# The release starts as a prerelease: the updater and the "latest" download
# links don't see one. verify-release.yml then checks the published files on
# each macOS, launches them, and updates the release before to this one; only
# if all that passes does it become the latest. A release that fails stays a
# prerelease, and nobody gets it: fix it and push a new tag, or rerun the
# failed jobs if Apple or GitHub was the trouble. If a pushed tag's run never
# starts (GitHub has dropped the event), `gh workflow run release.yml --ref vX`
# does the same. One release runs at a time, so that two close tags can't
# race for "latest"; a tag older than the latest is never made the latest.
#
# Signing and notarization use these repository secrets of jeiang/nanolight.
# All are optional. With all five, the app and image are signed with
# a Developer ID and notarized; without them, they are signed ad hoc
# (Gatekeeper asks once, and the app can't update itself): the Signing
# identity and Notary credentials steps are skipped when MACOS_CERT_P12 is
# empty, and `zig build package` then signs with "codesign --sign -".
#   MACOS_CERT_P12       base64 of a "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD  its password
#   AC_API_KEY_P8        an App Store Connect API key (the .p8's contents)
#   AC_API_KEY_ID        its key id
#   AC_API_ISSUER_ID     its issuer id
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A tag pushed while another's release runs waits for it (a newer tag still
# waiting replaces an older one).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # Zig: build.zig.zon's minimum_zig_version.
      - uses: mlugg/setup-zig@v2

      - name: Signing identity
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(uuidgen)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Notary credentials
        if: env.MACOS_CERT_P12 != '' && env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" > "$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # The Mac's app, disk image and update (signed, notarized and stapled
      # with the credentials above, then checked), Windows' and Linux'
      # archives, each build's debug symbols, and the feed naming them.
      - name: Package
        run: |
          version="$GITHUB_REF_NAME"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version="0.0.0-${GITHUB_SHA::7}" ;; esac
          zig build package -Dversion="$version"

      - uses: actions/upload-artifact@v4
        with:
          name: nanolight-macos-arm64
          path: |
            zig-out/package/nanolight-*
            zig-out/package/manifest.json

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          cd zig-out/package
          # The notes (what each build runs on) are tools/release.zig's, which the package wrote.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --title "Nanolight ${tag#v}" --notes-file notes.md
          # Every file the package made: the disk image, the updates, the
          # symbols, each one's .sha256, and the manifest.
          gh release upload "$tag" nanolight-* manifest.json --clobber

  verify:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      # A tag older than the latest release (a late dispatch, or a slow run)
      # would take "latest" back to it: it stays a prerelease, and says so.
      - name: Newer than the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "$GITHUB_REF_NAME" ]; then
            newest=$(printf '%s\n%s\n' "$latest" "$GITHUB_REF_NAME" | sort -V | tail -1)
            if [ "$newest" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$GITHUB_REF_NAME is older than the latest release, $latest: not made the latest"
              exit 1
            fi
          fi

      - name: The latest release, for everyone
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub answers 502 now and then, and may apply half of the edit: asks
        # again until "latest" really is this release, which everyone follows.
        run: |
          for try in 1 2 3 4 5; do
            if gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest &&
              [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)" = "$GITHUB_REF_NAME" ]; then
              exit 0
            fi
            echo "$GITHUB_REF_NAME isn't the latest yet (try $try); retrying" >&2
            sleep $((try * 20))
          done
          exit 1
